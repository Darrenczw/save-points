<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Save Points</title>
<meta name="description" content="Every game you've played, year by year.">
<meta name="theme-color" content="#0a0e1a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Save Points">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/overpass-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <span class="mark">Save Points</span>
  <span class="actions">
    <button class="icon-btn" id="add" aria-label="Add a game">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="icon-btn" id="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    </button>
  </span>
</header>
<main class="line" id="line" aria-label="Your games, year by year"></main>

<dialog class="sheet" id="game" aria-labelledby="g-name"></dialog>
<dialog class="map" id="map" aria-label="Line map"></dialog>
<dialog class="sheet" id="me" aria-label="Settings"></dialog>

<script src="vendor/supabase-2.49.4.js"></script>
<script src="app.js" type="module"></script>
</body>
</html>
